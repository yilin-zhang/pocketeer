[workspace]
resolver = "3"
members = ["crates/pocketeer-core", "crates/pocketeer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Yilin Zhang"]

[workspace.dependencies]
pocketeer-core = { path = "crates/pocketeer-core" }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
dirs = "6"
fs2 = "0.4"
md-5 = "0.10"
quick-xml = "0.42"
sha1 = "0.10"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde_bytes = "0.11"
thiserror = "2"
toml = "1.1"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

# dev
insta = { version = "1", features = ["json", "redactions"] }
mockito = { version = "1", default-features = false }
tempfile = "3"
