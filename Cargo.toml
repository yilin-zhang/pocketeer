[workspace]
resolver = "3"
members = ["crates/pocketeer-core", "crates/pocketeer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
authors = ["Yilin Zhang"]

[workspace.dependencies]
clap = { version = "4", features = ["derive", "string"] }
crossterm = "0.29"
crc32fast = "1"
fs-err = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
ureq = "3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Without "unicode-segmentation" it counts in characters, not graphemes.
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
trash = "5"
fs4 = "1"
bytesize = "2"

# dev
tempfile = "3"
